---
name: quality

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: actionlint version to use.
        default: 1.7.12
        required: false
        type: string
      actionlint-config:
        description: Path to actionlint configuration file.
        default: ""
        required: false
        type: string
      actionlint-flags:
        description: Additional actionlint command flags.
        default: ""
        required: false
        type: string
      checkout_fetch_depth:
        description: Fetch depth for checkout action.
        default: 0
        required: false
        type: number
      codespell-config:
        description: Path to codespell configuration file.
        default: ""
        required: false
        type: string
      codespell-ignore-words-file:
        description: Path to codespell ignored words file.
        default: ""
        required: false
        type: string
      codespell-ignore-words-list:
        description: Comma-separated list of words ignored by codespell.
        default: ""
        required: false
        type: string
      codespell-path:
        description: Path passed to codespell.
        default: ""
        required: false
        type: string
      codespell-skip:
        description: Comma-separated list of files or globs skipped by codespell.
        default: ./.git
        required: false
        type: string
      concurrency-group:
        description: Concurrency group name.
        default: quality/${{ github.workflow }}-${{ github.ref }}
        required: false
        type: string
      editorconfig-checker-version:
        description: EditorConfig Checker version to use.
        default: v3.7.0
        required: false
        type: string
      editorconfig-checker-config:
        description: Path to EditorConfig Checker configuration file.
        default: ""
        required: false
        type: string
      editorconfig-checker-exclude:
        description: Regular expression for paths excluded by EditorConfig Checker.
        default: ""
        required: false
        type: string
      enable-concurrency:
        description: Enable concurrency.
        default: true
        required: false
        type: boolean
      markdownlint-cli2-version:
        description: markdownlint-cli2 version to use.
        default: 0.22.1
        required: false
        type: string
      markdownlint-config:
        description: Path to markdownlint-cli2 configuration file.
        default: ""
        required: false
        type: string
      markdownlint-globs:
        description: Newline-separated markdownlint-cli2 glob patterns.
        default: "**/*.md"
        required: false
        type: string
      node-version:
        description: Node.js version to use.
        default: 24
        required: false
        type: string
      os:
        description: OS runner as a JSON array string '["ubuntu-latest"]'.
        default: '["ubuntu-latest"]'
        required: false
        type: string
      prettier-version:
        description: Prettier version to use.
        default: 3.8.4
        required: false
        type: string
      prettier-config:
        description: Path to Prettier configuration file.
        default: ""
        required: false
        type: string
      prettier-ignore-path:
        description: Path to Prettier ignore file.
        default: ""
        required: false
        type: string
      prettier-no-error-on-unmatched-pattern:
        description: Do not fail when a Prettier pattern matches no files.
        default: true
        required: false
        type: boolean
      prettier-patterns:
        description: Newline-separated Prettier file patterns. Overrides default Markdown/YAML patterns when set.
        default: ""
        required: false
        type: string
      validate_editorconfig:
        description: Enable EditorConfig validation.
        default: true
        required: false
        type: boolean
      validate_github_actions:
        description: Enable GitHub Actions workflow validation with actionlint.
        default: true
        required: false
        type: boolean
      validate_markdown:
        description: Enable Markdown validation.
        default: true
        required: false
        type: boolean
      validate_markdown_prettier:
        description: Enable Markdown formatting validation with Prettier.
        default: true
        required: false
        type: boolean
      validate_spell_codespell:
        description: Enable spelling validation with codespell.
        default: true
        required: false
        type: boolean
      validate_yaml:
        description: Enable YAML validation.
        default: true
        required: false
        type: boolean
      validate_yaml_prettier:
        description: Enable YAML formatting validation with Prettier.
        default: true
        required: false
        type: boolean
      yamllint-version:
        description: yamllint version to use.
        default: 1.38.0
        required: false
        type: string
      yamllint-config:
        description: Path to yamllint configuration file.
        default: ""
        required: false
        type: string
      yamllint-ignore:
        description: Newline-separated yamllint ignore patterns used with the default configuration.
        default: ""
        required: false
        type: string
      yamllint-targets:
        description: Newline-separated yamllint targets.
        default: |-
          .github
          actions
        required: false
        type: string

permissions:
  contents: read

jobs:
  actions:
    if: ${{ inputs.validate_github_actions }}
    name: GitHub Actions
    runs-on: ${{ matrix.os }}

    concurrency:
      cancel-in-progress: ${{ inputs.enable-concurrency }}
      group: actions-${{ matrix.os }}-${{ inputs.concurrency-group }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}
          persist-credentials: false

      - name: Checkout reusable actions.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yii2-framework-actions
          persist-credentials: false

      - name: Run actionlint.
        uses: ./.yii2-framework-actions/actions/actionlint
        with:
          config: ${{ inputs.actionlint-config }}
          flags: ${{ inputs.actionlint-flags }}
          version: ${{ inputs.actionlint-version }}

  editorconfig:
    if: ${{ inputs.validate_editorconfig }}
    name: EditorConfig
    runs-on: ${{ matrix.os }}

    concurrency:
      cancel-in-progress: ${{ inputs.enable-concurrency }}
      group: editorconfig-${{ matrix.os }}-${{ inputs.concurrency-group }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}
          persist-credentials: false

      - name: Checkout reusable actions.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yii2-framework-actions
          persist-credentials: false

      - name: Run EditorConfig Checker.
        uses: ./.yii2-framework-actions/actions/editorconfig-checker
        with:
          config: ${{ inputs.editorconfig-checker-config }}
          exclude: ${{ inputs.editorconfig-checker-exclude }}
          version: ${{ inputs.editorconfig-checker-version }}

  markdown:
    if: ${{ inputs.validate_markdown }}
    name: Markdown
    runs-on: ${{ matrix.os }}

    concurrency:
      cancel-in-progress: ${{ inputs.enable-concurrency }}
      group: markdown-${{ matrix.os }}-${{ inputs.concurrency-group }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}
          persist-credentials: false

      - name: Checkout reusable actions.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yii2-framework-actions
          persist-credentials: false

      - name: Run markdownlint.
        uses: ./.yii2-framework-actions/actions/markdownlint
        with:
          config: ${{ inputs.markdownlint-config }}
          globs: ${{ inputs.markdownlint-globs }}
          node-version: ${{ inputs.node-version }}
          version: ${{ inputs.markdownlint-cli2-version }}

  prettier:
    if: ${{ inputs.validate_markdown_prettier || inputs.validate_yaml_prettier }}
    name: Prettier
    runs-on: ${{ matrix.os }}

    concurrency:
      cancel-in-progress: ${{ inputs.enable-concurrency }}
      group: prettier-${{ matrix.os }}-${{ inputs.concurrency-group }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}
          persist-credentials: false

      - name: Checkout reusable actions.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yii2-framework-actions
          persist-credentials: false

      - name: Run Prettier.
        uses: ./.yii2-framework-actions/actions/prettier
        with:
          config: ${{ inputs.prettier-config }}
          ignore-path: ${{ inputs.prettier-ignore-path }}
          no-error-on-unmatched-pattern: ${{ inputs.prettier-no-error-on-unmatched-pattern }}
          node-version: ${{ inputs.node-version }}
          patterns: ${{ inputs.prettier-patterns }}
          validate-markdown: ${{ inputs.validate_markdown_prettier }}
          validate-yaml: ${{ inputs.validate_yaml_prettier }}
          version: ${{ inputs.prettier-version }}

  spelling:
    if: ${{ inputs.validate_spell_codespell }}
    name: Spelling
    runs-on: ${{ matrix.os }}

    concurrency:
      cancel-in-progress: ${{ inputs.enable-concurrency }}
      group: spelling-${{ matrix.os }}-${{ inputs.concurrency-group }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}
          persist-credentials: false

      - name: Checkout reusable actions.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yii2-framework-actions
          persist-credentials: false

      - name: Run codespell.
        uses: ./.yii2-framework-actions/actions/codespell
        with:
          config: ${{ inputs.codespell-config }}
          ignore-words-file: ${{ inputs.codespell-ignore-words-file }}
          ignore-words-list: ${{ inputs.codespell-ignore-words-list }}
          path: ${{ inputs.codespell-path }}
          skip: ${{ inputs.codespell-skip }}

  yaml:
    if: ${{ inputs.validate_yaml }}
    name: YAML
    runs-on: ${{ matrix.os }}

    concurrency:
      cancel-in-progress: ${{ inputs.enable-concurrency }}
      group: yaml-${{ matrix.os }}-${{ inputs.concurrency-group }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}
          persist-credentials: false

      - name: Checkout reusable actions.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yii2-framework-actions
          persist-credentials: false

      - name: Run yamllint.
        uses: ./.yii2-framework-actions/actions/yamllint
        with:
          config: ${{ inputs.yamllint-config }}
          ignore: ${{ inputs.yamllint-ignore }}
          targets: ${{ inputs.yamllint-targets }}
          version: ${{ inputs.yamllint-version }}
