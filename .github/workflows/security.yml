---
name: security

on:
  workflow_call:
    inputs:
      audit-inputs:
        description: Paths or workflow/action inputs passed to zizmor.
        default: .github
        required: false
        type: string
      checkout_fetch_depth:
        description: Fetch depth for checkout action.
        default: 0
        required: false
        type: number
      concurrency-group:
        description: Concurrency group name.
        default: security/${{ github.workflow }}-${{ github.ref }}
        required: false
        type: string
      enable-concurrency:
        description: Enable concurrency.
        default: true
        required: false
        type: boolean
      gitleaks-version:
        description: Gitleaks version to use.
        default: 8.30.1
        required: false
        type: string
      gitleaks-config:
        description: Path to Gitleaks configuration file.
        default: ""
        required: false
        type: string
      gitleaks-enable-summary:
        description: Enable Gitleaks job summary.
        default: true
        required: false
        type: boolean
      gitleaks-enable-upload-artifact:
        description: Enable Gitleaks SARIF artifact upload.
        default: true
        required: false
        type: boolean
      os:
        description: OS runner as a JSON array string '["ubuntu-latest"]'.
        default: '["ubuntu-latest"]'
        required: false
        type: string
      persona:
        description: zizmor persona to use while auditing.
        default: pedantic
        required: false
        type: string
      zizmor-config:
        description: Path to zizmor configuration file.
        default: ""
        required: false
        type: string
      zizmor-fail-on-no-inputs:
        description: Whether zizmor should fail when no inputs are collected.
        default: true
        required: false
        type: boolean
      zizmor-min-confidence:
        description: Minimum zizmor confidence level to report.
        default: ""
        required: false
        type: string
      zizmor-min-severity:
        description: Minimum zizmor severity level to report.
        default: ""
        required: false
        type: string
      zizmor-online-audits:
        description: Whether zizmor should run online audits.
        default: true
        required: false
        type: boolean
      validate_gitleaks:
        description: Enable secret scanning with Gitleaks.
        default: true
        required: false
        type: boolean
      validate_zizmor:
        description: Enable GitHub Actions security auditing with zizmor.
        default: true
        required: false
        type: boolean

    secrets:
      GITLEAKS_LICENSE:
        description: Gitleaks license for organization repositories.
        required: false

permissions:
  contents: read

jobs:
  secrets:
    if: ${{ inputs.validate_gitleaks }}
    name: Gitleaks
    runs-on: ${{ matrix.os }}

    concurrency:
      cancel-in-progress: ${{ inputs.enable-concurrency }}
      group: gitleaks-${{ matrix.os }}-${{ inputs.concurrency-group }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}

    steps:
      - name: Check Gitleaks license.
        id: gitleaks-license
        shell: bash
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          if [ -n "$GITLEAKS_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Gitleaks skipped::GITLEAKS_LICENSE is required for organization repositories."

      - name: Checkout repository.
        if: ${{ steps.gitleaks-license.outputs.available == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}
          persist-credentials: false

      - name: Run Gitleaks.
        if: ${{ steps.gitleaks-license.outputs.available == 'true' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: ${{ inputs.gitleaks-enable-summary }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: ${{ inputs.gitleaks-enable-upload-artifact }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}

  zizmor:
    if: ${{ inputs.validate_zizmor }}
    name: Zizmor
    runs-on: ${{ matrix.os }}

    concurrency:
      cancel-in-progress: ${{ inputs.enable-concurrency }}
      group: zizmor-${{ matrix.os }}-${{ inputs.concurrency-group }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}
          persist-credentials: false

      - name: Run zizmor.
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
          annotations: true
          config: ${{ inputs.zizmor-config }}
          fail-on-no-inputs: ${{ inputs.zizmor-fail-on-no-inputs }}
          inputs: ${{ inputs.audit-inputs }}
          min-confidence: ${{ inputs.zizmor-min-confidence }}
          min-severity: ${{ inputs.zizmor-min-severity }}
          online-audits: ${{ inputs.zizmor-online-audits }}
          persona: ${{ inputs.persona }}
