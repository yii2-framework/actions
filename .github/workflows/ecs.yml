---
name: ecs

on:
  workflow_call:
    inputs:
      command-options:
        description: Options for the Easy Coding Standard tool.
        default: check --ansi
        required: false
        type: string
      composer-command:
        description: Composer command (install or update) to run.
        default: update
        required: false
        type: string
      composer-flags:
        description: Additional composer flags
        default: >-
          --prefer-dist
          --no-interaction
          --no-progress
          --optimize-autoloader
          --ansi
        required: false
        type: string
      composer-version:
        description: Composer version to use.
        default:
        required: false
        type: string
      concurrency-group:
        description: Concurrency group name.
        default: ${{ github.workflow }}-${{ github.ref }}
        required: false
        type: string
      download-config:
        description: Whether to download the ECS config file.
        default: false
        required: false
        type: boolean
      enable-concurrency:
        description: Enable concurrency.
        default: true
        required: false
        type: boolean
      extensions:
        description: List of extensions to PHP.
        default:
        required: false
        type: string
      os:
        description: OS runner as a JSON array string '["ubuntu-latest"]'.
        default: '["ubuntu-latest"]'
        required: false
        type: string
      php-ini-values:
        description: Initial values for PHP configuration.
        default: date.timezone='UTC'
        required: false
        type: string
      php-version:
        description: PHP versions as a JSON array string '["8.5"]'.
        default: '["8.5"]'
        required: false
        type: string
      tools:
        description: Tools to test, separated by comma.
        default:
        required: false
        type: string

    secrets:
      AUTH_TOKEN:
        description: GitHub token.
        required: false

permissions:
  contents: read

jobs:
  ecs:
    name: PHP ${{ matrix.php-version }}-${{ matrix.os }}

    concurrency:
      group: ${{ matrix.os }}-${{ matrix.php-version }}-${{ inputs.concurrency-group }}
      cancel-in-progress: ${{ inputs.enable-concurrency }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
        php-version: ${{ fromJson(inputs.php-version) }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout reusable actions.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yii2-framework-actions
          persist-credentials: false

      - name: Download ECS config file.
        if: ${{ inputs.download-config }}
        shell: bash
        run: |
          # skip download if ecs.php already exists in the repository
          if [ -f ecs.php ]; then
            echo "Using ecs.php from repository"
            exit 0
          fi

          set -e
          echo "Downloading ecs.php from main branch..."

          wget --timeout=10 --tries=3 \
            https://raw.githubusercontent.com/yii2-extensions/template/main/ecs.php \
            -O ecs.php

          # validate it's a PHP file
          if ! head -1 ecs.php | grep -q "<?php"; then
            echo "Error: Downloaded file is not a valid PHP file."
            exit 1
          fi

      - name: Setup PHP Environment.
        uses: ./.yii2-framework-actions/actions/php-setup
        with:
          auth-token: ${{ secrets.AUTH_TOKEN }}
          composer-command: ${{ inputs.composer-command }}
          composer-flags: ${{ inputs.composer-flags }}
          composer-version: ${{ inputs.composer-version }}
          coverage-driver: none
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.php-ini-values }}
          php-version: ${{ matrix.php-version }}
          tools: ${{ inputs.tools }}

      - name: Run Easy Coding Standard.
        shell: bash
        env:
          ECS_COMMAND: >-
            vendor/bin/ecs
            ${{ inputs.command-options }}
        run: bash -euo pipefail -c "$ECS_COMMAND"
