---
name: PHP setup with composer.
description: Setup PHP environment with composer and install dependencies.

inputs:
  auth-token:
    description: GitHub token.
    default:
    required: false
  composer-command:
    description: Composer command (install or update) to run.
    default: update
    required: false
  composer-flags:
    description: Additional composer flags
    default: >-
      --prefer-dist
      --no-interaction
      --no-progress
      --optimize-autoloader
      --ansi
    required: false
  composer-version:
    description: Composer version to use.
    default:
    required: false
  coverage-driver:
    description: Code coverage driver to use (pcov, xdebug).
    default: pcov
    required: false
  extensions:
    description: List of extensions to PHP.
    default:
    required: false
  ignore-platform-reqs:
    description: Whether to add --ignore-platform-reqs to composer command.
    default: false
    required: false
  ini-values:
    description: Initial values for PHP configuration.
    default: date.timezone='UTC'
    required: false
  php-version:
    description: PHP version to install (for example, "8.4").
    default: "8.4"
    required: false
  tools:
    description: Tools to test, separated by comma.
    default:
    required: false

runs:
  using: composite
  steps:
    - name: Checkout repository.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        clean: false
        persist-credentials: false

    - name: Build PHP ini values.
      id: build-ini-values
      shell: bash
      env:
        COVERAGE_DRIVER: ${{ inputs.coverage-driver }}
        INI_VALUES: ${{ inputs.ini-values }}
      run: |
        if [ "$COVERAGE_DRIVER" = "none" ] \
          && ! echo "$INI_VALUES" | grep -Eiq '(^|[[:space:],])opcache\.enable_cli[[:space:]]*='; then
          if [ -n "$INI_VALUES" ]; then
            INI_VALUES="$INI_VALUES, opcache.enable_cli=1"
          else
            INI_VALUES="opcache.enable_cli=1"
          fi
        fi

        echo "values=$INI_VALUES" >> "$GITHUB_OUTPUT"

    - name: Install PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        coverage: ${{ inputs.coverage-driver }}
        extensions: ${{ inputs.extensions }}
        ini-values: ${{ steps.build-ini-values.outputs.values }}
        php-version: ${{ inputs.php-version }}
        tools: ${{ inputs.tools }}

    - name: Update composer.
      shell: bash
      env:
        COMPOSER_VERSION: ${{ inputs.composer-version }}
      run: |
        if [ -n "$COMPOSER_VERSION" ]; then
          composer self-update "$COMPOSER_VERSION"
        else
          composer self-update
        fi

    - name: Configure composer on linux.
      shell: bash
      if: runner.os == 'Linux'
      env:
        AUTH_TOKEN: ${{ inputs.auth-token }}
      run: |
        if [ "$AUTH_TOKEN" != '' ]; then
          composer config -g github-oauth.github.com "$AUTH_TOKEN";
        fi

    - name: Configure composer on windows.
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        if ($env:AUTH_TOKEN -ne '') {
          composer config -g github-oauth.github.com $env:AUTH_TOKEN
        }
      env:
        AUTH_TOKEN: ${{ inputs.auth-token }}

    - name: Install dependencies with composer.
      shell: bash
      env:
        COMPOSER_INSTALL_COMMAND: >-
          composer
          ${{ inputs.composer-command }}
          ${{ inputs.composer-flags }}
          ${{
            inputs.ignore-platform-reqs == 'true'
            && '--ignore-platform-reqs'
            || ''
          }}
      run: bash -euo pipefail -c "$COMPOSER_INSTALL_COMMAND"
