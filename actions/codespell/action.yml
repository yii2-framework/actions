---
name: codespell.
description: Run codespell with repository defaults for reusable workflows.

inputs:
  config:
    description: Path to codespell configuration file.
    default: ""
    required: false
  ignore-words-file:
    description: Path to codespell ignored words file.
    default: ""
    required: false
  ignore-words-list:
    description: Comma-separated list of words ignored by codespell.
    default: ""
    required: false
  path:
    description: Path passed to codespell.
    default: ""
    required: false
  skip:
    description: Additional comma-separated files or globs, appended to configuration-file exclusions.
    default: ./.git
    required: false
  use-shared-config:
    description: Append the shared Yii2 exclusions when no configuration file path is provided.
    default: "false"
    required: false

runs:
  using: composite
  steps:
    - name: Resolve codespell exclusions.
      id: exclusions
      shell: bash
      env:
        USE_SHARED_EXCLUSIONS: ${{ inputs.use-shared-config == 'true' && inputs.config == '' }}
        CODESPELL_SKIP: ${{ inputs.skip }}
      run: |
        skip='./.yii2-framework-actions'

        if [ "$USE_SHARED_EXCLUSIONS" = "true" ]; then
          shared=$(paste -sd, "$GITHUB_ACTION_PATH/quality-excludes.txt")
          skip+=",$shared"
        fi

        if [[ "$CODESPELL_SKIP" == *$'\n'* || "$CODESPELL_SKIP" == *$'\r'* ]]; then
          echo "::error::Codespell exclusions must be a single comma-separated line."
          exit 1
        fi

        if [ -n "$CODESPELL_SKIP" ]; then
          skip+=",$CODESPELL_SKIP"
        fi

        printf 'skip=%s\n' "$skip" >> "$GITHUB_OUTPUT"

    - name: Run codespell.
      uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
      with:
        config: ${{ inputs.config }}
        ignore_words_file: ${{ inputs.ignore-words-file }}
        ignore_words_list: ${{ inputs.ignore-words-list }}
        path: ${{ inputs.path }}
        skip: ${{ steps.exclusions.outputs.skip }}
