---
name: Node.js setup with dependencies.
description: Set up Node.js and install project dependencies for reusable workflows.

inputs:
  cache:
    description: Package manager cache that setup-node restores and saves; `npm` is the supported value and empty disables the package cache.
    default: npm
    required: false
  install-command:
    description: Command that installs the project dependencies; empty skips installation.
    default: npm ci
    required: false
  node-version:
    description: Node.js version to use (for example, "24"); takes precedence over `node-version-file`.
    default: ""
    required: false
  node-version-file:
    description: File that declares the Node.js version, used only when `node-version` is empty.
    default: .nvmrc
    required: false

runs:
  using: composite
  steps:
    - name: Set up Node.js.
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: ${{ inputs.cache }}
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
        package-manager-cache: false

    - name: Install dependencies.
      if: inputs.install-command != ''
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: bash -euo pipefail -c "$INSTALL_COMMAND"
