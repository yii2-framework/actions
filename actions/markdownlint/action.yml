---
name: markdownlint.
description: Run markdownlint-cli2 with repository defaults for reusable workflows.

inputs:
  config:
    description: Path to markdownlint-cli2 configuration file.
    default: ""
    required: false
  globs:
    description: Newline-separated markdownlint-cli2 glob patterns.
    default: "**/*.md"
    required: false
  node-version:
    description: Node.js version to use.
    default: 24
    required: false
  version:
    description: markdownlint-cli2 version to use.
    default: 0.22.1
    required: false

runs:
  using: composite
  steps:
    - name: Set up Node.js.
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run markdownlint.
      shell: bash
      env:
        MARKDOWNLINT_CONFIG: ${{ inputs.config }}
        MARKDOWNLINT_CLI2_VERSION: ${{ inputs.version }}
        MARKDOWNLINT_GLOBS: ${{ inputs.globs }}
      run: |
        args=()
        globs=()
        positive_globs=0

        if [ -n "$MARKDOWNLINT_CONFIG" ]; then
          args+=("--config" "$MARKDOWNLINT_CONFIG")
        else
          config="$(mktemp -d)/.markdownlint-cli2.jsonc"
          cat > "$config" <<'EOF'
        {"config":{"MD013":false,"MD033":false}}
        EOF
          args+=("--config" "$config")
        fi

        while IFS= read -r glob; do
          if [ -n "$glob" ]; then
            globs+=("$glob")

            if [[ "$glob" != !* && "$glob" != \#* ]]; then
              positive_globs=$((positive_globs + 1))
            fi
          fi
        done <<< "$MARKDOWNLINT_GLOBS"

        if [ "$positive_globs" -eq 0 ]; then
          echo "No markdownlint glob patterns configured; skipping."
          exit 0
        fi

        globs+=("#.yii2-framework-actions/**")

        npm exec --yes --package "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION" -- \
          markdownlint-cli2 "${args[@]}" "${globs[@]}"
