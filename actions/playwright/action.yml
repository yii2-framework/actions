---
name: Playwright browsers.
description: Install Playwright browsers with the Playwright bin that the project dependencies installed in node_modules/.bin.

inputs:
  browsers:
    description: Browsers to install, separated by whitespace; empty installs the Playwright default browsers.
    default: chromium
    required: false
  only-shell:
    description: Whether to add --only-shell to install only the headless shell of Chromium.
    default: false
    required: false
  with-deps:
    description: Whether to add --with-deps to install the operating system dependencies of the browsers.
    default: true
    required: false

runs:
  using: composite
  steps:
    - name: Install Playwright browsers.
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
        PLAYWRIGHT_ONLY_SHELL: ${{ inputs.only-shell }}
        PLAYWRIGHT_WITH_DEPS: ${{ inputs.with-deps }}
      run: |
        set -euo pipefail

        # Only the `playwright` bin that the project install linked into `node_modules/.bin` of the working directory is
        # used, never npx, the npm cache or PATH. npm links it on Linux and macOS and writes a shell shim next to the
        # `.cmd` and `.ps1` shims on Windows, so the same path exists and runs from bash on every runner.
        playwright="./node_modules/.bin/playwright"

        if [ ! -f "$playwright" ]; then
          echo "::error title=Playwright not installed::$playwright was not found; add playwright or @playwright/test to the project dependencies and install them before this action."
          exit 1
        fi

        version="$("$playwright" --version)"
        echo "Using Playwright: $version"

        args=(install)

        if [ "$PLAYWRIGHT_WITH_DEPS" = "true" ]; then
          args+=("--with-deps")
        fi

        if [ "$PLAYWRIGHT_ONLY_SHELL" = "true" ]; then
          args+=("--only-shell")
        fi

        # Browsers are whitespace-separated; each word is passed as one argument.
        if [ -n "$PLAYWRIGHT_BROWSERS" ]; then
          read -r -a browsers <<< "${PLAYWRIGHT_BROWSERS//[$'\r\n']/ }"

          if [ "${#browsers[@]}" -gt 0 ]; then
            args+=("${browsers[@]}")
          fi
        fi

        printf 'Playwright command:'
        printf ' %q' "$playwright" "${args[@]}"
        printf '\n'

        "$playwright" "${args[@]}"
